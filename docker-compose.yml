services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campusclubs
      POSTGRES_USER: campusclubs
      POSTGRES_PASSWORD: campusclubs
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusclubs -d campusclubs"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: campusclubs
      DB_USERNAME: campusclubs
    command:
      - sh
      - -c
      - |
        set -e
        composer install --no-interaction --prefer-dist
        if [ ! -f .env ]; then cp .env.example .env; fi
        if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi
        php artisan migrate --force
        php artisan db:seed --force
        php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend_vendor:
  postgres_data:
  frontend_node_modules:
